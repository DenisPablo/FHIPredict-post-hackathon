[project]
name = "fhipredict-backend"
version = "0.1.0"
description = "FastAPI live fire-risk inference server using LightGBM and Open-Meteo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "lightgbm>=4.5.0",
    "joblib>=1.4.0",
    "numpy>=2.0.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
